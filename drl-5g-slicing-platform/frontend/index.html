<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRL 5G Slicing Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>DRL 5G NR Network Slicing</h1>
      <p>Configure scenario JSON and execute ns-3/OpenGym simulation.</p>

      <label for="scenario">Scenario payload</label>
      <textarea id="scenario" rows="16"></textarea>

      <div class="actions">
        <button id="save">Save Scenario</button>
        <button id="run">Run Simulation</button>
      </div>

      <pre id="output"></pre>
    </main>
    <script src="app.js"></script>
  </body>
</html>
